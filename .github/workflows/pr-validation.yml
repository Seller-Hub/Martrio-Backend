name: PR Validation

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 7.0

      # - name: Restore Dependencies
      #   run: dotnet restore ./SellerHub/SellerHub.csproj

      - name: Build Project
        run: dotnet build ./SellerHub/SellerHub.csproj --configuration Release --no-restore

      # - name: Run Tests
      #   run: dotnet test ./SellerHub.Tests/SellerHub.Tests.csproj --no-build --verbosity normal
