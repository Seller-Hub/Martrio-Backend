name: PR Validation

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Display .NET SDK Version
        run: dotnet --version

      - name: Restore Dependencies
        run: dotnet restore ./SellerHub/SellerHub.csproj

      - name: Build Project
        run: dotnet build ./SellerHub/SellerHub.csproj --configuration Release --no-restore

      # - name: Run Tests
      #   run: dotnet test ./SellerHub.Tests/SellerHub.Tests.csproj --no-build --verbosity normal
